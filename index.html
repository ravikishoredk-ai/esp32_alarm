<!DOCTYPE html>
<html>
<head>
    <title>Multi-Alarm Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input[type="time"] { font-size: 18px; padding: 10px; margin-bottom: 10px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .alarm-item { display: flex; justify-content: space-between; background: #eee; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .delete-btn { background: #f44336; padding: 5px 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Set Your Alarms</h2>
        <input type="time" id="alarmTime" required>
        <button onclick="addAlarm()">Add Alarm</button>
        
        <h3>Active Alarms</h3>
        <div id="alarmList"></div>
    </div>

    <script>
        async function fetchAlarms() {
            const res = await fetch('/api/alarms');
            const alarms = await res.json();
            const list = document.getElementById('alarmList');
            list.innerHTML = '';
            alarms.forEach(a => {
                list.innerHTML += `<div class="alarm-item">
                    <span>${a.time}</span>
                    <button class="delete-btn" onclick="deleteAlarm('${a.id}')">Delete</button>
                </div>`;
            });
        }

        async function addAlarm() {
            const time = document.getElementById('alarmTime').value;
            if(!time) return alert("Select a time!");
            await fetch('/api/alarms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ time: time })
            });
            fetchAlarms();
        }

        async function deleteAlarm(id) {
            await fetch(`/api/alarms/${id}`, { method: 'DELETE' });
            fetchAlarms();
        }

        fetchAlarms();
    </script>
</body>
</html>
